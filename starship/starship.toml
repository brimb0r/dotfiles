# ~/.config/starship.toml — tuned for brimb0r's stack
# Go · Rust · .NET · Terraform · Azure · K8s
# ------------------------------------------------------------
add_newline = true
command_timeout = 1000

format = """
[┌](bold green)$username$hostname$directory$git_branch$git_status$git_state
[│](bold green)$golang$rust$dotnet$nodejs$terraform$kubernetes$azure$aws$package
[└](bold green)$cmd_duration$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold yellow"
format = "@[$hostname]($style) "

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"
read_only = " "
format = "in [$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[N](bold green)"

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "

# ---- git ----
[git_branch]
symbol = "⎇ "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style)) '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "…${count}"
stashed = "≡"
modified = "✱${count}"
staged = "✚${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ---- languages / tooling (only show inside relevant projects) ----
[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[dotnet]
symbol = ".NET "
style = "bold blue"
format = "via [$symbol($version )($tfm )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold 208"
format = "is [$symbol$version]($style) "

# ---- infra / cloud ----
[terraform]
symbol = "󱁢 "
style = "bold 105"
format = "on [$symbol$workspace]($style) "

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold 33"
format = 'on [$symbol$context( \($namespace\))]($style) '

[azure]
disabled = false
symbol = "󰠅 "
style = "bold blue"
format = "on [$symbol($subscription)]($style) "

[aws]
symbol = " "
style = "bold 208"
format = "on [$symbol($profile )(\\($region\\) )]($style)"
