# ~/.tmux.conf — brimb0r
# ------------------------------------------------------------
# Easier prefix: Ctrl-a (press Ctrl-a, THEN the command key)
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a Ctrl-a sends a literal Ctrl-a

# Mouse: click panes, drag borders, scroll, select
set -g mouse on

# Sane splits that keep the current directory:
#   prefix |  -> split left|right
#   prefix -  -> split top/bottom
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config:  prefix r
bind r source-file ~/.tmux.conf \; display-message "✔ tmux.conf reloaded"

# Move between panes with prefix + arrows, or Alt+arrows (no prefix)
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize with prefix + Shift-arrows (repeatable)
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# Quality of life
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1         # panes start at 1
set -g renumber-windows on        # keep window numbers gapless
set -g history-limit 100000       # big scrollback
set -sg escape-time 10            # snappy ESC (good for vim)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor
setw -g mode-keys vi              # vi keys in copy mode

# Copy-mode: v to select, y to yank (like vim)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ------------------------------------------------------------
# Status bar — clean, informative
# ------------------------------------------------------------
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour234,fg=colour137"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=colour green,fg=colour234,bold] #S #[bg=colour234,fg=colour green]"

# Right: host + date + time
set -g status-right-length 60
set -g status-right "#[fg=colour245] #H #[fg=colour137]%Y-%m-%d #[fg=colour green,bold]%H:%M "

# Windows
setw -g window-status-current-style "fg=colour234,bg=colour137,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-format " #I:#W#F "

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour green"
